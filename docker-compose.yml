version: "3.8"

services:
  configvault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: configvault
    hostname: configvault.local
    ports:
      - "8103:8103"
    volumes:
      - ./instance:/app/instance
      - ./config:/app/config
      - ./configs:/var/lib/configvault/configs
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SQLALCHEMY_DATABASE_URI=sqlite:///instance/configvault.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/api/v1/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
